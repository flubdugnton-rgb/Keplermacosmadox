name: Compilar Kepleræ macOS 2.0

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Preparar fontes quando enviadas em ZIP
        run: |
          if [[ ! -f project.yml ]]; then
            test -f Keplerae-macOS-2.0-fontes.zip || { echo 'Envie os fontes ou Keplerae-macOS-2.0-fontes.zip para a raiz do repositório.'; exit 1; }
            unzip -oq Keplerae-macOS-2.0-fontes.zip
          fi
      - name: Verificar Xcode e instalar XcodeGen
        run: |
          xcodebuild -version
          brew install xcodegen
      - name: Importar certificado Apple, quando configurado
        if: github.event_name != 'pull_request'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE_P12_BASE64" ]]; then
            echo 'Sem certificado configurado: gerar build de teste ad hoc.'
            exit 0
          fi
          certificate="$RUNNER_TEMP/keplerae-signing.p12"
          signing_keychain="$RUNNER_TEMP/keplerae-signing.keychain-db"
          signing_password=$(openssl rand -hex 24)
          echo "::add-mask::$signing_password"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$signing_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$signing_password" "$signing_keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$signing_keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$signing_password" "$signing_keychain"
          security list-keychains -d user -s "$signing_keychain" "$HOME/Library/Keychains/login.keychain-db"
          identity=$(security find-identity -v -p codesigning "$signing_keychain" | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -1)
          test -n "$identity" || { echo 'Certificado Developer ID Application não encontrado.'; exit 1; }
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          rm "$certificate"
      - name: Testar, compilar e empacotar para Mac
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash scripts/build_macos.sh
      - name: Conferir abertura do aplicativo
        run: |
          open dist/Keplerae.app
          sleep 10
          pgrep -x Keplerae
          screencapture -x build/macOS-launch.png
      - name: Disponibilizar aplicativo e instalador
        uses: actions/upload-artifact@v4
        with:
          name: Keplerae-macOS-2.0-universal
          path: |
            dist/Keplerae-macOS-2.0.zip
            dist/Keplerae-macOS-2.0.dmg
            dist/SHA256SUMS.txt
            build/macOS-launch.png
          if-no-files-found: error
      - name: Disponibilizar diagnóstico dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-test-results
          path: build/CoreTests.xcresult
          if-no-files-found: ignore
      - name: Remover chaveiro temporário
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/keplerae-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/keplerae-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/keplerae-signing.p12"
